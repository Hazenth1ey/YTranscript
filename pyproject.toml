# This file describes the project to Python's packaging tools.
# ``pip install -e .`` reads it, installs the dependencies listed below, and
# creates the ``ytranscript`` and ``ytranscript-web`` commands.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytranscript"
version = "0.1.0"
description = "Generate transcripts from video links (YouTube captions, with optional Whisper speech-to-text fallback)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Always installed.
dependencies = [
    "youtube-transcript-api>=1.0",
    "flask>=3.0",
]

# Installed only when you ask for them, e.g. ``pip install -e ".[whisper]"``.
[project.optional-dependencies]
whisper = [
    "yt-dlp>=2024.1.1",
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8",
]

# The commands that get created on your PATH.
[project.scripts]
ytranscript = "ytranscript.cli:main"
ytranscript-web = "ytranscript.web:main"

[tool.setuptools.packages.find]
include = ["ytranscript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
